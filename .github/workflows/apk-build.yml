name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwabuilder-cli

      - name: Generate Android Package
        run: |
          pwabuilder package --manifest https://itsrakibhasanofficial.github.io/Card-Score-by-Rakib/manifest.json --platforms android --directory ./output
        continue-on-error: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardScore-APK
          path: ./output
