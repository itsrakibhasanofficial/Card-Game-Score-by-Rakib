name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build PWA to APK using PWABuilder CLI
        run: |
          npm install -g @pwabuilder/pwabuilder-cli
          # Automatically generates native signed Android package
